<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Asterisk: Vltava — WebXR Spatial Symphony &amp; Sign Engine</title>
  <style>
    :root {
      --bg: #030712;
      --panel: rgba(8, 15, 34, 0.82);
      --cyan: #22d3ee;
      --gold: #fbbf24;
      --blue: #3b82f6;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 25%, #0f1f3d 0%, var(--bg) 75%);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #hud {
      position: fixed;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
      z-index: 10;
    }
    .panel {
      pointer-events: auto;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: 14px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      max-width: 440px;
    }
    .title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.4px;
      color: var(--cyan);
      margin: 0 0 4px 0;
    }
    .sub {
      font-size: 12px;
      color: var(--muted);
      margin: 0;
      line-height: 1.4;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.35);
      background: rgba(34, 211, 238, 0.12);
      color: var(--cyan);
    }
    .badge.gold {
      border-color: rgba(251, 191, 36, 0.4);
      background: rgba(251, 191, 36, 0.12);
      color: var(--gold);
    }
    #controls {
      position: fixed;
      bottom: 76px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      background: var(--panel);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(34, 211, 238, 0.28);
      border-radius: 999px;
      z-index: 10;
    }
    .btn {
      appearance: none;
      border: 1px solid rgba(34, 211, 238, 0.35);
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:hover { transform: translateY(-1px); border-color: var(--cyan); }
    .btn.active {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #020617;
      border-color: transparent;
    }
    .btn.play {
      border-color: rgba(251, 191, 36, 0.5);
      color: var(--gold);
    }
    .btn.play.active {
      background: linear-gradient(135deg, var(--gold), #f59e0b);
      color: #020617;
    }
    #telemetry {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--cyan);
      margin-top: 6px;
    }
    @media (max-width: 700px) {
      #hud { flex-direction: column; }
      .panel { max-width: 100%; }
      #controls { width: calc(100% - 24px); border-radius: 16px; bottom: 72px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="panel">
      <h1 class="title">🌊 ASTERISK: VLTAVA SPATIAL SYMPHONY</h1>
      <p class="sub">Hands-First WebXR (60 cm zóna vsedě) · 3D Avatar ČZJ &amp; vibro-akustický tok Bedřicha Smetany</p>
      <div class="badges">
        <span class="badge">Meta Quest Hand Tracking</span>
        <span class="badge gold">SPARK Level 4 Gold · 738/738 VCs</span>
      </div>
      <div id="telemetry">Glosa: VÍTEJTE | Vibro: 65 Hz | Model: načítání...</div>
    </div>
  </div>

  <div id="controls">
    <button class="btn play" id="btnPlay">▶ Vltava (Audio + Tok)</button>
    <button class="btn active" data-gloss="WELCOME">👋 Vítejte</button>
    <button class="btn" data-gloss="VLTAVA">🌊 Vltava</button>
    <button class="btn" data-gloss="MUSIC">🎵 Hudba</button>
    <button class="btn" data-gloss="THANKS">🙏 Děkuji</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRButton } from 'three/addons/webxr/VRButton.js';
    import { XRHandModelFactory } from 'three/addons/webxr/XRHandModelFactory.js';

    const telemetryEl = document.getElementById('telemetry');
    const playBtn = document.getElementById('btnPlay');
    const glossButtons = [...document.querySelectorAll('[data-gloss]')];

    // --- State ---
    const GLOSSES = {
      WELCOME: { label: 'VÍTEJTE (WELCOME)', color: 0x22d3ee, sway: 0.25, lift: 0.18 },
      VLTAVA:  { label: 'VLTAVA (RIVER FLOW)', color: 0x3b82f6, sway: 0.45, lift: 0.08 },
      MUSIC:   { label: 'HUDBA (SYMPHONY)', color: 0xfbbf24, sway: 0.65, lift: 0.28 },
      THANKS:  { label: 'DĚKUJI (THANKS)', color: 0x34d399, sway: 0.15, lift: 0.35 }
    };
    let activeGloss = 'WELCOME';
    let isPlaying = false;
    let currentVibroHz = 65;
    let audioEnergy = 0.15;

    // --- Three.js Scene & WebXR Renderer ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030712);
    scene.fog = new THREE.FogExp2(0x030712, 0.18);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.05, 50);
    camera.position.set(0, 1.35, 0.85);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    const vrBtn = VRButton.createButton(renderer, {
      optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking']
    });
    document.body.appendChild(vrBtn);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.05, -0.60);
    controls.enableDamping = true;
    controls.minDistance = 0.4;
    controls.maxDistance = 3.0;
    controls.update();

    // --- Lighting ---
    scene.add(new THREE.HemisphereLight(0x93c5fd, 0x0f172a, 1.1));
    const keyLight = new THREE.DirectionalLight(0xe0f2fe, 2.0);
    keyLight.position.set(1.2, 2.4, 1.6);
    scene.add(keyLight);
    const rimLight = new THREE.PointLight(0x22d3ee, 2.2, 5);
    rimLight.position.set(-0.8, 1.5, -1.2);
    scene.add(rimLight);

    // --- 60 cm Comfort Ring (Seated / Stationary Zone) ---
    const zoneRing = new THREE.Mesh(
      new THREE.RingGeometry(0.58, 0.60, 64),
      new THREE.MeshBasicMaterial({ color: 0x22d3ee, side: THREE.DoubleSide, transparent: true, opacity: 0.35 })
    );
    zoneRing.rotation.x = -Math.PI / 2;
    zoneRing.position.set(0, 0.02, 0);
    scene.add(zoneRing);

    // --- 3D Vltava River Particle Flow ---
    const PARTICLE_COUNT = 1800;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PARTICLE_COUNT * 3);
    const pSeed = new Float32Array(PARTICLE_COUNT);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const t = Math.random();
      pSeed[i] = t;
      pPos[i * 3] = (t - 0.5) * 4.0;
      pPos[i * 3 + 1] = 0.65 + (Math.random() - 0.5) * 0.25;
      pPos[i * 3 + 2] = -0.65 + Math.sin(t * Math.PI * 3) * 0.35 + (Math.random() - 0.5) * 0.2;
    }
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0x38bdf8,
      size: 0.016,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending
    });
    const riverParticles = new THREE.Points(pGeo, pMat);
    scene.add(riverParticles);

    // --- Load 3D Avatar Model (assets/3dmodel.glb) ---
    const avatarAnchor = new THREE.Group();
    avatarAnchor.position.set(0, 0.90, -0.62);
    scene.add(avatarAnchor);

    let avatarRoot = null;
    let mixer = null;
    let modelStatus = 'načítání...';

    const loader = new GLTFLoader();
    loader.load(
      'assets/3dmodel.glb',
      (gltf) => {
        avatarRoot = gltf.scene;
        const box = new THREE.Box3().setFromObject(avatarRoot);
        const size = new THREE.Vector3();
        box.getSize(size);
        const maxDim = Math.max(size.x, size.y, size.z) || 1;
        const scale = 0.58 / maxDim;
        avatarRoot.scale.setScalar(scale);

        const center = new THREE.Vector3();
        box.getCenter(center);
        avatarRoot.position.sub(center.multiplyScalar(scale));
        avatarRoot.position.y += 0.16;
        avatarAnchor.add(avatarRoot);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(avatarRoot);
          mixer.clipAction(gltf.animations[0]).play();
        }
        modelStatus = '3dmodel.glb OK';
        updateTelemetry();
      },
      undefined,
      () => {
        // Fallback geometric conductor totem if GLB fails to load
        const fallback = new THREE.Mesh(
          new THREE.IcosahedronGeometry(0.16, 2),
          new THREE.MeshStandardMaterial({ color: 0x22d3ee, wireframe: true })
        );
        avatarAnchor.add(fallback);
        avatarRoot = fallback;
        modelStatus = 'fallback mesh';
        updateTelemetry();
      }
    );

    // --- Hands-First 3D Spatial Controls (60 cm reach) ---
    const spatialButtons = [];
    const btnSpecs = [
      { id: 'PLAY', label: 'VLTAVA', x: -0.24, y: 0.92, z: -0.45, color: 0xfbbf24 },
      { id: 'WELCOME', label: 'VÍTEJTE', x: -0.08, y: 0.90, z: -0.45, color: 0x22d3ee },
      { id: 'MUSIC', label: 'HUDBA', x: 0.08, y: 0.90, z: -0.45, color: 0x3b82f6 },
      { id: 'THANKS', label: 'DĚKUJI', x: 0.24, y: 0.92, z: -0.45, color: 0x34d399 }
    ];
    btnSpecs.forEach((spec) => {
      const orb = new THREE.Mesh(
        new THREE.SphereGeometry(0.032, 24, 24),
        new THREE.MeshStandardMaterial({
          color: spec.color,
          emissive: spec.color,
          emissiveIntensity: 0.45,
          roughness: 0.25,
          metalness: 0.4
        })
      );
      orb.position.set(spec.x, spec.y, spec.z);
      orb.userData = { action: spec.id, cooldown: 0 };
      scene.add(orb);
      spatialButtons.push(orb);
    });

    // --- Meta Quest WebXR Hand Tracking ---
    const handModelFactory = new XRHandModelFactory();
    const hands = [];
    for (let i = 0; i < 2; i++) {
      const hand = renderer.xr.getHand(i);
      hand.add(handModelFactory.createHandModel(hand, 'mesh'));
      scene.add(hand);
      hands.push(hand);
    }

    // --- Web Audio API: Smetana's Vltava + 20-250 Hz Vibro-Acoustic Sub ---
    let audioCtx = null;
    let schedulerId = null;
    let noteIdx = 0;
    // E-minor Vltava motif (Hz) & durations (ms)
    const VLTAVA_NOTES = [
      [329.63, 280], [440.00, 280], [493.88, 560], [493.88, 280],
      [493.88, 280], [523.25, 280], [493.88, 280], [440.00, 280],
      [392.00, 560], [369.99, 280], [392.00, 280], [329.63, 840]
    ];

    function playNextNote() {
      if (!isPlaying || !audioCtx) return;
      const [freq, durMs] = VLTAVA_NOTES[noteIdx % VLTAVA_NOTES.length];
      noteIdx++;

      const now = audioCtx.currentTime;
      const dur = durMs / 1000;

      // Melodic voice
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.14, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + dur + 0.02);

      // SPARK-bounded vibro-acoustic sub frequency (20 <= f <= 250 Hz)
      const vibroFreq = Math.max(20, Math.min(250, Math.round(freq / 4)));
      currentVibroHz = vibroFreq;
      audioEnergy = 0.85;

      const subOsc = audioCtx.createOscillator();
      const subGain = audioCtx.createGain();
      subOsc.type = 'sine';
      subOsc.frequency.setValueAtTime(vibroFreq, now);
      subGain.gain.setValueAtTime(0.001, now);
      subGain.gain.exponentialRampToValueAtTime(0.18, now + 0.05);
      subGain.gain.exponentialRampToValueAtTime(0.001, now + dur);
      subOsc.connect(subGain).connect(audioCtx.destination);
      subOsc.start(now);
      subOsc.stop(now + dur + 0.02);

      updateTelemetry();
      schedulerId = setTimeout(playNextNote, durMs);
    }

    function toggleAudio() {
      isPlaying = !isPlaying;
      playBtn.classList.toggle('active', isPlaying);
      playBtn.textContent = isPlaying ? '⏸ Zastavit Vltavu' : '▶ Vltava (Audio + Tok)';
      if (isPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        playNextNote();
      } else {
        clearTimeout(schedulerId);
        audioEnergy = 0.15;
        currentVibroHz = 65;
        updateTelemetry();
      }
    }

    function setGloss(key) {
      if (!GLOSSES[key]) return;
      activeGloss = key;
      glossButtons.forEach((b) => b.classList.toggle('active', b.dataset.gloss === key));
      pMat.color.setHex(GLOSSES[key].color);
      updateTelemetry();
    }

    function updateTelemetry() {
      telemetryEl.textContent = `Glosa: ${GLOSSES[activeGloss].label} | Vibro: ${currentVibroHz} Hz | Model: ${modelStatus}`;
    }

    playBtn.addEventListener('click', toggleAudio);
    glossButtons.forEach((b) => b.addEventListener('click', () => setGloss(b.dataset.gloss)));

    // --- Animation Loop ---
    const clock = new THREE.Clock();
    const tmpVec = new THREE.Vector3();

    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.05);
      const t = clock.elapsedTime;
      audioEnergy = THREE.MathUtils.lerp(audioEnergy, isPlaying ? 0.45 : 0.15, dt * 3);

      if (mixer) mixer.update(dt);
      if (avatarRoot) {
        const g = GLOSSES[activeGloss];
        avatarAnchor.rotation.y = Math.sin(t * 1.4) * g.sway;
        avatarAnchor.position.y = 0.90 + Math.sin(t * 2.2) * 0.025 + g.lift * 0.05;
      }

      // Animate Vltava particle stream
      const posAttr = pGeo.attributes.position;
      const arr = posAttr.array;
      const speed = (isPlaying ? 0.36 : 0.14) * dt;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        pSeed[i] = (pSeed[i] + speed) % 1.0;
        const u = pSeed[i];
        const x = (u - 0.5) * 4.0;
        const wave = Math.sin(u * Math.PI * 3 + t * 2.1) * (0.25 + audioEnergy * 0.22);
        arr[i * 3] = x;
        arr[i * 3 + 1] = 0.65 + Math.cos(u * Math.PI * 4 + t * 2.5) * (0.04 + audioEnergy * 0.08);
        arr[i * 3 + 2] = -0.65 + wave;
      }
      posAttr.needsUpdate = true;

      // Check WebXR hand-tracking proximity to 3D buttons (hands-first)
      spatialButtons.forEach((orb, idx) => {
        orb.userData.cooldown = Math.max(0, orb.userData.cooldown - dt);
        orb.position.y = btnSpecs[idx].y + Math.sin(t * 2 + idx) * 0.008;
        hands.forEach((hand) => {
          const tip = hand.joints && hand.joints['index-finger-tip'];
          if (tip && orb.userData.cooldown <= 0) {
            tip.getWorldPosition(tmpVec);
            if (tmpVec.distanceTo(orb.position) < 0.055) {
              orb.userData.cooldown = 0.8;
              if (orb.userData.action === 'PLAY') toggleAudio();
              else setGloss(orb.userData.action);
            }
          }
        });
      });

      controls.update();
      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
